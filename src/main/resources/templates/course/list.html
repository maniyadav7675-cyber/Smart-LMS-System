<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Course List — Smart LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/layout :: navbar}"></div>

<!-- Flash Messages -->
<div th:replace="~{fragments/layout :: messages}"></div>

<div class="container">

    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-book me-2"></i>Course List</h2>
        <a th:href="@{/courses/add}" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i>Add Course
        </a>
    </div>

    <!-- Search & Filter Bar -->
    <form th:action="@{/courses}" method="get" class="card card-body mb-4 bg-light">
        <div class="row g-3 align-items-end">
            <div class="col-md-4">
                <label for="keyword" class="form-label">Search</label>
                <input type="text" id="keyword" name="keyword" class="form-control"
                       placeholder="Name, code or description…"
                       th:value="${keyword}"/>
            </div>
            <div class="col-md-3">
                <label for="fromDate" class="form-label">From Date</label>
                <input type="date" id="fromDate" name="fromDate" class="form-control"
                       th:value="${fromDate}"/>
            </div>
            <div class="col-md-3">
                <label for="toDate" class="form-label">To Date</label>
                <input type="date" id="toDate" name="toDate" class="form-control"
                       th:value="${toDate}"/>
            </div>
            <div class="col-md-2 d-flex gap-2">
                <button type="submit" class="btn btn-outline-primary w-100">
                    <i class="bi bi-search"></i> Search
                </button>
                <a th:href="@{/courses}" class="btn btn-outline-secondary w-100">
                    <i class="bi bi-x-circle"></i> Clear
                </a>
            </div>
        </div>
    </form>

    <!-- Course Table -->
    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Image</th>
                <th>Code</th>
                <th>Name</th>
                <th>Description</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th class="text-center">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="course, iter : ${courses}">
                <td th:text="${iter.index + 1}"></td>
                <td>
                    <img th:if="${course.imagePath != null}"
                         th:src="@{'/uploads/' + ${course.imagePath}}"
                         alt="Course image"
                         class="rounded" width="60" height="60"
                         style="object-fit: cover;"/>
                    <span th:unless="${course.imagePath != null}"
                          class="text-muted">No image</span>
                </td>
                <td><span class="badge bg-secondary" th:text="${course.code}"></span></td>
                <td th:text="${course.name}"></td>
                <td>
                    <span th:text="${#strings.abbreviate(course.description, 50)}"></span>
                </td>
                <td th:text="${course.startDate}"></td>
                <td th:text="${course.endDate}"></td>
                <td class="text-center text-nowrap">
                    <a th:href="@{/courses/edit/{id}(id=${course.id})}"
                       class="btn btn-sm btn-outline-warning me-1"
                       title="Edit">
                        <i class="bi bi-pencil-square"></i>
                    </a>
                    <a th:href="@{/courses/delete/{id}(id=${course.id})}"
                       class="btn btn-sm btn-outline-danger"
                       title="Delete"
                       onclick="return confirm('Are you sure you want to delete this course?');">
                        <i class="bi bi-trash"></i>
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(courses)}">
                <td colspan="8" class="text-center text-muted py-4">
                    No courses found.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
