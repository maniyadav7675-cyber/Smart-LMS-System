<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Learner List — Smart LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/layout :: navbar}"></div>

<!-- Flash Messages -->
<div th:replace="~{fragments/layout :: messages}"></div>

<div class="container">

    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-people me-2"></i>Learner List</h2>
        <a th:href="@{/learners/add}" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i>Add Learner
        </a>
    </div>

    <!-- Search Bar -->
    <form th:action="@{/learners}" method="get" class="card card-body mb-4 bg-light">
        <div class="row g-3 align-items-end">
            <div class="col-md-8">
                <label for="keyword" class="form-label">Search</label>
                <input type="text" id="keyword" name="keyword" class="form-control"
                       placeholder="Name or email…"
                       th:value="${keyword}"/>
            </div>
            <div class="col-md-4 d-flex gap-2">
                <button type="submit" class="btn btn-outline-primary w-100">
                    <i class="bi bi-search"></i> Search
                </button>
                <a th:href="@{/learners}" class="btn btn-outline-secondary w-100">
                    <i class="bi bi-x-circle"></i> Clear
                </a>
            </div>
        </div>
    </form>

    <!-- Learner Table -->
    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Image</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Courses</th>
                <th class="text-center">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="learner, iter : ${learners}">
                <td th:text="${iter.index + 1}"></td>
                <td>
                    <img th:if="${learner.imagePath != null}"
                         th:src="@{'/uploads/' + ${learner.imagePath}}"
                         alt="Profile"
                         class="rounded-circle" width="50" height="50"
                         style="object-fit: cover;"/>
                    <span th:unless="${learner.imagePath != null}"
                          class="text-muted"><i class="bi bi-person-circle fs-3"></i></span>
                </td>
                <td th:text="${learner.fullName}"></td>
                <td th:text="${learner.email}"></td>
                <td th:text="${learner.phone ?: '—'}"></td>
                <td>
                    <span th:each="c, cIter : ${learner.courses}">
                        <span class="badge bg-info text-dark" th:text="${c.name}"></span>
                    </span>
                    <span th:if="${#sets.isEmpty(learner.courses)}" class="text-muted">None</span>
                </td>
                <td class="text-center text-nowrap">
                    <a th:href="@{/learners/edit/{id}(id=${learner.id})}"
                       class="btn btn-sm btn-outline-warning me-1"
                       title="Edit">
                        <i class="bi bi-pencil-square"></i>
                    </a>
                    <a th:href="@{/learners/delete/{id}(id=${learner.id})}"
                       class="btn btn-sm btn-outline-danger"
                       title="Delete"
                       onclick="return confirm('Are you sure you want to delete this learner?');">
                        <i class="bi bi-trash"></i>
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(learners)}">
                <td colspan="7" class="text-center text-muted py-4">
                    No learners found.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
