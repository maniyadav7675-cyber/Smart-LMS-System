<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${pageTitle} + ' — Smart LMS'">Learner Form — Smart LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">

    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-person-plus me-2"></i>
                        <span th:text="${pageTitle}">Learner Form</span>
                    </h4>
                </div>
                <div class="card-body">

                    <form th:action="@{/learners/save}" th:object="${learner}"
                          method="post" enctype="multipart/form-data" novalidate>

                        <!-- Hidden ID for edit mode -->
                        <input type="hidden" th:field="*{id}"/>
                        <input type="hidden" th:field="*{createdAt}"/>
                        <input type="hidden" th:field="*{updatedAt}"/>

                        <!-- First Name & Last Name -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="firstName" class="form-label">First Name <span class="text-danger">*</span></label>
                                <input type="text" id="firstName" th:field="*{firstName}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'"
                                       placeholder="e.g. John"/>
                                <div class="invalid-feedback" th:each="err : ${#fields.errors('firstName')}"
                                     th:text="${err}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="lastName" class="form-label">Last Name <span class="text-danger">*</span></label>
                                <input type="text" id="lastName" th:field="*{lastName}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'"
                                       placeholder="e.g. Doe"/>
                                <div class="invalid-feedback" th:each="err : ${#fields.errors('lastName')}"
                                     th:text="${err}"></div>
                            </div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                            <input type="email" id="email" th:field="*{email}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                   placeholder="e.g. john.doe@example.com"/>
                            <div class="invalid-feedback" th:each="err : ${#fields.errors('email')}"
                                 th:text="${err}"></div>
                        </div>

                        <!-- Phone -->
                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="text" id="phone" th:field="*{phone}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                                   placeholder="e.g. +1-555-123-4567"/>
                            <div class="invalid-feedback" th:each="err : ${#fields.errors('phone')}"
                                 th:text="${err}"></div>
                        </div>

                        <!-- Course Selection (checkboxes) -->
                        <div class="mb-3">
                            <label class="form-label">Select Courses <span class="text-danger">*</span></label>

                            <!-- Validation error for courses -->
                            <div th:if="${#fields.hasErrors('courses')}" class="text-danger mb-2">
                                <small th:each="err : ${#fields.errors('courses')}" th:text="${err}"></small>
                            </div>

                            <div th:if="${#lists.isEmpty(allCourses)}" class="text-muted">
                                No courses available. <a th:href="@{/courses/add}">Create a course first.</a>
                            </div>

                            <div class="row">
                                <div th:each="course : ${allCourses}" class="col-md-6 mb-2">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox"
                                               name="courseIds"
                                               th:value="${course.id}"
                                               th:id="'course-' + ${course.id}"
                                               th:checked="${learner.courses != null AND learner.courses.contains(course)}"/>
                                        <label class="form-check-label" th:for="'course-' + ${course.id}">
                                            <span class="badge bg-secondary me-1" th:text="${course.code}"></span>
                                            <span th:text="${course.name}"></span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Profile Image -->
                        <div class="mb-3">
                            <label for="imageFile" class="form-label">Profile Image</label>
                            <input type="file" id="imageFile" name="imageFile"
                                   class="form-control" accept="image/*"/>
                            <div class="form-text">Max 5 MB. JPG, PNG or GIF.</div>

                            <div th:if="${learner.imagePath != null}" class="mt-2">
                                <img th:src="@{'/uploads/' + ${learner.imagePath}}"
                                     alt="Current profile" class="rounded-circle border"
                                     width="100" height="100"
                                     style="object-fit: cover;"/>
                                <small class="d-block text-muted mt-1">Current image — upload a new file to replace it.</small>
                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/learners}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left me-1"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-check-lg me-1"></i>Save Learner
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
